name: ci

on:
    pull_request:
        branches:
            - main
        types:
            - closed

permissions:
    contents: write
    id-token: write

jobs:
    release:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - run: npm ci
            - run: npm run typecheck
            - run: npm run build
            - run: npx --no-install biome check src

            - name: check package version
              id: version
              run: |
                  PACKAGE_NAME="$(node -p "require('./package.json').name")"
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  TAG="v$PACKAGE_VERSION"
                  LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

                  if [ -z "$LAST_TAG" ] || [ "$TAG" != "$LAST_TAG" ]; then
                      SHOULD_RELEASE=true
                  elif git show-ref --verify --quiet "refs/tags/$TAG"; then
                      SHOULD_RELEASE=true
                  else
                      SHOULD_RELEASE=false
                      echo "package version unchanged: $PACKAGE_VERSION"
                  fi

                  echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
                  echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

            - name: create tag
              if: steps.version.outputs.should_release == 'true'
              env:
                  TAG: ${{ steps.version.outputs.tag }}
                  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
              run: |
                  if git show-ref --verify --quiet "refs/tags/$TAG"; then
                      test "$(git rev-list -n 1 "$TAG")" = "$MERGE_SHA"
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "$TAG" "$MERGE_SHA" -m "release: $TAG"
                  git push origin "$TAG"

            - name: publish package
              if: steps.version.outputs.should_release == 'true'
              env:
                  PACKAGE_NAME: ${{ steps.version.outputs.name }}
                  PACKAGE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
                      echo "package already published: $PACKAGE_NAME@$PACKAGE_VERSION"
                  else
                      npm publish --access public
                  fi

            - name: create release
              if: steps.version.outputs.should_release == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_BODY: ${{ github.event.pull_request.body }}
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "release already exists: $TAG"
                      exit 0
                  fi

                  NOTES_FILE="$RUNNER_TEMP/release-notes.md"
                  printf '%s' "$PR_BODY" > "$NOTES_FILE"
                  gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE"
